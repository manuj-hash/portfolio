    <script>
      // Bulletproof direct file opener fallback
      // Browsers block ES modules on file:// protocol, so auto-redirect to standalone zero-dependency build
      if (window.location.protocol === 'file:') {
        var target = 'index-standalone.html';
        if (window.location.pathname.indexOf('/dist/') !== -1 || window.location.pathname.indexOf('\\dist\\') !== -1) {
          target = '../index-standalone.html';
        }
        window.location.replace(target);
      }
    </script>
